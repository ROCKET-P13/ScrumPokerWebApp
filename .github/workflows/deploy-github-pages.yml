# Serves only dist/ (built app). In Settings → Pages, use “GitHub Actions”, not “Deploy from branch” with main/root.

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Vite bakes import.meta.env.VITE_WS_URL into the bundle at build time.
      # Set it under Settings → Secrets and variables → Actions (Variable or Secret named VITE_WS_URL).
      # Must be a public wss:// URL to your real server (GitHub Pages does not host WebSockets).
      - name: Install and build
        env:
          GH_PAGES_BASE: ${{ format('/{0}/', github.event.repository.name) }}
          SECRET_VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VAR_VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          if [ -n "${SECRET_VITE_WS_URL}" ]; then
            export VITE_WS_URL="${SECRET_VITE_WS_URL}"
          elif [ -n "${VAR_VITE_WS_URL}" ]; then
            export VITE_WS_URL="${VAR_VITE_WS_URL}"
          else
            echo "::error::Set Actions secret or variable VITE_WS_URL (e.g. wss://your-api.example.com/ws). Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
