# Serves only dist/ (built app). In Settings → Pages, use “GitHub Actions”, not “Deploy from branch” with main/root.

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Required so secrets/vars attached only to the "github-pages" environment are visible here.
    # (Repository-level Variables / Secrets work without this.)
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Vite bakes import.meta.env.VITE_WS_URL at build time. Use a wss:// URL to your server.
      - name: Install and build
        env:
          GH_PAGES_BASE: ${{ format('/{0}/', github.event.repository.name) }}
          SECRET_VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VAR_VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_VITE_WS_URL:-}" ]; then
            export VITE_WS_URL="${SECRET_VITE_WS_URL}"
            echo "::notice::Using secret VITE_WS_URL for the build."
          elif [ -n "${VAR_VITE_WS_URL:-}" ]; then
            export VITE_WS_URL="${VAR_VITE_WS_URL}"
            echo "::notice::Using variable VITE_WS_URL for the build."
          else
            echo "::error::VITE_WS_URL not found. Add it as either:"
            echo "::error::  - Repository secret or variable (Settings → Secrets and variables → Actions → Secrets / Variables), or"
            echo "::error::  - Environment secret or variable on the 'github-pages' environment (this job now uses environment: github-pages)."
            exit 1
          fi
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
